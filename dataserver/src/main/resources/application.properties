# Carrega as credenciais do arquivo .env (na raiz do projeto ou na pasta atual).
# Variaveis de ambiente do sistema tem prioridade sobre o .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Porta HTTP: o Render informa a dele na variável PORT; localmente fica a 8080
server.port=${PORT:8080}
# Atrás de um proxy (Render), usa o X-Forwarded-For/Proto para saber o IP e o https
# reais do cliente. Só é aceito quando vem de um proxy da rede interna.
server.forward-headers-strategy=native

# Sites que podem chamar a API pelo navegador, separados por vírgula
# (no Render: a URL do site, ex. https://dataserver-web.onrender.com)
cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Supabase / PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões (HikariCP)
# O pooler do Supabase em modo sessão (porta 5432) aceita no máximo 15 conexões no total,
# compartilhadas entre o Java, o Python e qualquer outra instância. O padrão do Spring (10)
# esgotava esse limite com duas instâncias do Java no ar.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Mantém só 1 conexão aberta quando ocioso; abre mais sob demanda (até o máximo).
spring.datasource.hikari.minimum-idle=1

# Serviço Python de análise (usado pelo /relatorio)
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8001}
# Chave enviada ao Python no cabeçalho X-Chave-Interna (precisa ser igual à dele).
# Vazia = não envia (uso local, com o Python também sem chave).
python.service.chave=${CHAVE_INTERNA:}

# Login (tokens JWT)
# JWT_SECRET é obrigatório: valor aleatório com pelo menos 32 caracteres. Trocar o
# segredo derruba todos os logins ativos (os tokens antigos deixam de valer).
seguranca.jwt.segredo=${JWT_SECRET:}
# Quanto tempo o login vale antes de pedir e-mail e senha de novo
seguranca.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:8}
# Primeiro usuário, criado na subida se o e-mail ainda não existir (ver AdminInicial)
seguranca.admin.email=${ADMIN_EMAIL:}
seguranca.admin.senha=${ADMIN_SENHA:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# Log de cada SQL executado: desligado por padrão (polui o console).
# Para depurar: DB_SHOW_SQL=true no .env
spring.jpa.show-sql=${DB_SHOW_SQL:false}
