# Carrega as credenciais do arquivo .env (na raiz do projeto ou na pasta atual).
# Variaveis de ambiente do sistema tem prioridade sobre o .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Supabase / PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
